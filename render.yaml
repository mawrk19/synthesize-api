# Render Blueprint — PHP/Laravel requires Docker on Render (no native PHP runtime).
# Docs: https://render.com/docs/deploy-php-laravel-docker

services:
  - type: web
    name: synthesize-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: UPLOADS_DISK
        value: s3
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://synthesize-api.onrender.com
      - key: FRONTEND_URL
        value: https://synthesize-client-kappa.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://synthesize-client-kappa.vercel.app
      - key: SEED_ON_DEPLOY
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "false"

  - type: worker
    name: synthesize-api-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: docker/entrypoint-worker.sh
    envVars:
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: APP_ENV
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: APP_DEBUG
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: LOG_CHANNEL
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: DB_CONNECTION
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: DB_SSLMODE
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: QUEUE_CONNECTION
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: CACHE_STORE
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: SESSION_DRIVER
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: UPLOADS_DISK
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: APP_KEY
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: APP_URL
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: FRONTEND_URL
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: CORS_ALLOWED_ORIGINS
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: AI_API_KEY
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: AI_BASE_URL
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: AI_MODEL
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: AWS_ACCESS_KEY_ID
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: AWS_SECRET_ACCESS_KEY
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: AWS_DEFAULT_REGION
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: AWS_BUCKET
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: AWS_ENDPOINT
      - fromService:
          type: web
          name: synthesize-api
          envVarKey: AWS_USE_PATH_STYLE_ENDPOINT
